## ══════════════════════════════════════════════════════════════════
## Vhost nginx de ImmoBudget — site 100% statique (une seule page, aucun backend)
# Même EC2 / même nginx que tikka : les vhosts cohabitent, distingués par
# `server_name`. Aucune route /api (l'app est entièrement locale au navigateur).
# Cloudflare ne supporte que :
# ports HTTP  : 80, 8080, 8880, 2052, 2082, 2086, 2095
# ports HTTPS : 443, 2053, 2083, 2087, 2096, 8443
# Sur le load balancer AWS, autoriser ces ports dans le security group.
## ══════════════════════════════════════════════════════════════════
server {
    listen 80;

    server_name immobudget.cloudsecops-services.com;

    ## ── Fichiers statiques (index.html livré tel quel depuis le dépôt) ──
    root /var/www/immobudget;
    index index.html;

    ## ── App mono-page : tout retombe sur index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    ## ── Le HTML ne doit pas être mis en cache (toujours la dernière version) ──
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    ## ── Logs ──
    access_log /var/log/nginx/immobudget_access.log;
    error_log  /var/log/nginx/immobudget_error.log;
}
